[project]
name = "askpolicy"
version = "0.1.0"
description = "Secure multilingual enterprise RAG"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bm25s",
    "faiss-cpu",
    "fastapi",
    "pwdlib[argon2]",
    "pydantic>=2,<3",
    "PyJWT",
    "streamlit",
    "torch==2.15.0",
    "transformers==5.23.0",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
